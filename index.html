<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラクメシ - 大学生のためのレシピ提案</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ ラクメシ</h1>
            <p>金欠・時間ない・腹減った。<br>今の気分を選ぶだけで提案します。</p>
        </header>

        <section class="action-area">
            <button class="mood-btn" data-id="36">🍱 週末の作り置き</button>

            <button class="mood-btn" data-id="33">🍖 がっつり・簡単</button>
            
            <button class="mood-btn" data-id="30">⏱️ 秒でごはん</button>

            <button class="mood-btn" data-id="11-70">💪 筋トレ（鶏むね）</button>
        </section>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>美味しそうなやつを探してます...</p>
        </div>

        <main id="recipe-list" class="recipe-grid">
            <div class="placeholder-msg">
                ☝️ 上のボタンを押してみてね
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
