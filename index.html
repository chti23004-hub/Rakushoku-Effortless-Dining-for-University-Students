<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラクショク - 大学生のためのレシピ提案</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ ラクショク</h1>
            <p class="subtitle">”楽に”　”楽しく”　”食す”</p>
            <p>今の気分を選ぶだけ<br>あなたに代わって、最高のメニューを提案します</p>
        </header>

        <section class="action-area">
            <button class="mood-btn" data-group="trendy">🍖 流行りをガッツリ</button>
            <button class="mood-btn" data-group="lazy">⏱️ 秒でごはん（レンジ）</button>
            <button class="mood-btn" data-group="healthy">💪 体づくり・ヘルシー</button>
            <button class="mood-btn" data-group="cheap">💸 限界・節約メシ</button>
        </section>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>おすすめのレシピをピックアップ中...</p>
        </div>

        <main id="recipe-list" class="recipe-grid">
            <div class="placeholder-msg">
                ☝️ 今日の気分ボタンを押してください
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
